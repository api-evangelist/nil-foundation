aid: nil-foundation
name: =nil; Foundation
description: >-
  =nil; Foundation is the developer of =nil;, an Ethereum Layer 2 blockchain powered by
  zkSharding that delivers horizontal scalability with built-in cross-shard communication
  and zero-knowledge proofs. On =nil; all accounts are smart contracts (no EOAs), state is
  partitioned across execution shards, and correctness is verified with zk proofs while
  Ethereum provides data availability and consensus. Developers build with Solidity smart
  contracts and interact with the cluster through an Ethereum-style JSON-RPC 2.0 API, the
  @nilfoundation/niljs TypeScript client library, the =nil; CLI, and a Hardhat plugin.
  =nil; Foundation also develops zkLLVM (a zero-knowledge proof circuit compiler) and the
  Placeholder proof system with an in-EVM verifier. The company is a portfolio company of
  Polychain Capital.
